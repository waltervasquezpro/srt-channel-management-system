<!DOCTYPE html>
<html>
<head>
    <title>Streams Delivery Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a href="/" class="navbar-brand mb-0 h1 text-decoration-none">Streams Delivery Manager</a>

            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a href="/services/" class="btn btn-outline-light btn-sm">Services</a>

                    {% if user.is_superuser %}
                        <a href="/admin/" class="btn btn-outline-warning btn-sm">Admin</a>
                    {% endif %}

                    <span class="text-white small">Hi, {{ user.username }}</span>

                    <form method="post" action="/logout/" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</body>
</html>
